<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="stage"><canvas id="c"></canvas><canvas id="ov"></canvas><div id="menu" role="dialog" aria-label="Choose a tram stop" hidden></div><div id="start" role="dialog" aria-label="Menu" hidden></div><div id="fade"></div><div id="convo" role="dialog" aria-label="Conversation" hidden><div class="portrait"><canvas width="30" height="30"></canvas><b class="who"></b><small class="job"></small><span class="fac"></span></div><div class="said" aria-live="polite"></div><div class="opts"></div></div></div>
<p>Walk to the edge exits (labelled) to change area &middot; Arrows/WASD &middot; E to use tram stops &middot; Layouts are placeholders</p>
<div id="controls"><label>Jump to: <select id="jump"></select></label><label>Date: <select id="dayjump"></select></label><button id="daynight" type="button" aria-pressed="false" title="Day or night (N)"></button><button id="startbtn" type="button" aria-expanded="false" title="Menu (M)">&#9776; Menu</button><span id="testtools" title="Test tools">Test: <select id="tfac" aria-label="Faction"></select><button id="tplus" type="button">+10</button><button id="tminus" type="button">&minus;10</button><button id="tday" type="button">Next day</button></span></div>
<div id="pad"><span></span><button data-d="1">&#9650;</button><button id="act" aria-label="Action">E</button>
<button data-d="2">&#9664;</button><button data-d="0">&#9660;</button><button data-d="3">&#9654;</button></div>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/art.js"></script>
<script src="js/store.js"></script>
<script src="js/game.js"></script>
<script src="js/games.js"></script></body></html>
